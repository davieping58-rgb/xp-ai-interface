name: Tattie Agent Production Smoke
on:
  push:
    branches: [main]
    paths:
      - 'api/tattie/**'
      - '.github/workflows/tattie-agent-production-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel production
        run: sleep 60
      - name: Health check
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --retry 5 --retry-delay 10 \
            https://xp-ai-interface.vercel.app/api/tattie/health | tee health.json
          grep -q '"ok":true' health.json
          grep -q '"separateFromXP":true' health.json
      - name: Real Wee Tattie reply
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --retry 2 --retry-delay 10 \
            -X POST https://xp-ai-interface.vercel.app/api/tattie/chat \
            -H 'Content-Type: application/json' \
            -d '{"message":"Say hello in one short sentence and tell me your name.","history":[]}' | tee chat.json
          grep -q '"reply"' chat.json
          grep -qi 'tattie' chat.json
