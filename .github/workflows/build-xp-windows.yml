name: Build XP Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['desktop/**','assets/xp_face.png','.github/workflows/build-xp-windows.yml']
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Copy approved XP face into desktop bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'desktop/assets' | Out-Null
          Copy-Item 'assets/xp_face.png' 'desktop/assets/xp_face.png' -Force
          if (!(Test-Path 'desktop/assets/xp_face.png')) { throw 'XP face copy failed' }
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install
      - name: Verify XP interface requirements
        shell: pwsh
        run: |
          $html = Get-Content 'desktop/index.html' -Raw
          $js = Get-Content 'desktop/renderer.js' -Raw
          if ($html -notmatch 'src="assets/xp_face.png"') { throw 'Packaged XP face path missing' }
          @('modes','memory','voice','vision','text','settings','system','brainButton','fullscreen','cameraOn','coreInput','attach','send') | ForEach-Object { if (($html + $js) -notmatch $_) { throw "Missing control: $_" } }
      - name: JavaScript syntax check
        working-directory: desktop
        shell: pwsh
        run: |
          node --check main.js
          node --check preload.js
          node --check renderer.js
      - name: Build Windows installer
        working-directory: desktop
        run: npm run build:win
      - name: Verify installer exists
        shell: pwsh
        run: |
          $exe = Get-ChildItem 'desktop/dist' -Filter '*.exe' | Select-Object -First 1
          if (!$exe) { throw 'Windows installer was not created' }
          Write-Host "Verified installer: $($exe.FullName)"
      - uses: actions/upload-artifact@v4
        with:
          name: XP-AI-Systems-Windows
          path: desktop/dist/*.exe
          if-no-files-found: error
