name: Build XP Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'constants/**'
      - 'store/**'
      - 'utils/**'
      - 'assets/**'
      - 'app.json'
      - 'package.json'
      - 'babel.config.js'
      - '.github/workflows/build-xp-android.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --clean
      - name: Build installable APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Verify APK
        run: test -f android/app/build/outputs/apk/debug/app-debug.apk
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk XP-MOTHERSHIP-PHONE.apk
      - uses: actions/upload-artifact@v4
        with:
          name: XP-MOTHERSHIP-PHONE
          path: XP-MOTHERSHIP-PHONE.apk
          if-no-files-found: error
