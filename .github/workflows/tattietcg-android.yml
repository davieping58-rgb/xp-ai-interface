name: TattieTCG Android APK
on:
  workflow_dispatch:
  push:
    branches: [tattietcg-android]
    paths: ['tattietcg/**', '.github/workflows/tattietcg-android.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tattietcg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm || true
      - name: Verify requested Tattie screens and plumbing before build
        run: |
          grep -q "https://tattie-tcg.myshopify.com" src/App.js
          grep -q "LAST 5 SALES" src/App.js
          grep -q "Wee Tattie" src/App.js
          grep -q "QRCode" src/App.js
          grep -q "DOMHNALL • XP" src/App.js
          grep -q "#a855f7" src/App.js
          echo 'TATTIE_SOURCE_REQUIREMENTS_PASS'
      - run: npm install --no-audit --no-fund
      - run: npx expo install --check
      - run: npx expo prebuild --platform android
      - name: Build standalone APK
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --build-cache
      - name: Boot Android and prove the app installs, launches and stays open
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          working-directory: tattietcg
          script: |
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            adb shell monkey -p uk.domhnall.tattietcg -c android.intent.category.LAUNCHER 1
            sleep 15
            PID=$(adb shell pidof uk.domhnall.tattietcg 2>/dev/null | tr -d '\r' | tr -d '\n')
            if [ -z "$PID" ]; then
              PID=$(adb shell ps -A | grep 'uk.domhnall.tattietcg' | head -n1 | awk '{print $2}' | tr -d '\r')
            fi
            echo "TattieTCG PID: $PID"
            adb shell dumpsys activity activities | grep 'uk.domhnall.tattietcg' || true
            adb shell uiautomator dump /sdcard/tattie.xml >/dev/null || true
            adb shell cat /sdcard/tattie.xml | grep -q 'TATTIE TCG' || (echo 'TATTIE_HOME_UI_NOT_VISIBLE' && exit 1)
            adb logcat -d | grep -A30 -B10 -E 'FATAL EXCEPTION|AndroidRuntime|uk.domhnall.tattietcg|ReactNativeJS' || true
            test -n "$PID" || (echo 'APP_NOT_RUNNING_AFTER_LAUNCH' && exit 1)
            ! adb logcat -d | grep -A12 -B3 'FATAL EXCEPTION' | grep -q 'uk.domhnall.tattietcg' || (echo 'Runtime crash detected' && exit 1)
            echo 'RUNTIME_SMOKE_TEST_PASS'
      - run: cp android/app/build/outputs/apk/release/app-release.apk TattieTCG.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TattieTCG-Android-APK
          path: tattietcg/TattieTCG.apk
          retention-days: 30
