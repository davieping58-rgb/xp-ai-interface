name: TattieTCG Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - tattietcg-android
    paths:
      - 'tattietcg/**'
      - '.github/workflows/tattietcg-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tattietcg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Tattie source and runner
        run: |
          set -e
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          grep -q "./src/AppFinal" index.js
          grep -q "home-screen-exact.png" src/AppFinal.js
          grep -q "function Scanner" src/AppFinal.js
          grep -q "function Tattie" src/AppFinal.js
          grep -q "function Community" src/AppFinal.js
          grep -q '"name": "TattieTCG"' app.json
          grep -q '"package": "uk.domhnall.tattietcg"' app.json
          grep -q '"versionCode": 23' app.json
          test "$(git hash-object assets/home-screen-exact.png)" = '7011fa135d7219ce23ad1b700b3d84394e45ff8b'
          if grep -Eqi 'XP Control|Holographic Control|XP Face|xp_face|assets/xp|MOTHERSHIP|xpcore' src/AppFinal.js app.json index.js; then
            echo 'XP contamination detected'
            exit 1
          fi
          ! grep -q 'HEY LEGEND' src/AppFinal.js
          ! grep -q 'LAST 5' src/AppFinal.js
          echo 'TATTIE_SOURCE_PASS'

      - name: Rebuild Wee Tattie helper image
        run: |
          base64 -d assets/wee-tattie-home.b64 > assets/wee-tattie-home.jpg
          test -s assets/wee-tattie-home.jpg

      - name: Validate approved home artwork
        run: |
          python -m pip install --disable-pip-version-check --quiet pillow
          python - <<'PY'
          from PIL import Image
          p='assets/home-screen-exact.png'
          im=Image.open(p)
          im.verify()
          im=Image.open(p)
          if im.size != (1024,1536):
              raise SystemExit(f'wrong home dimensions: {im.size}')
          print('APPROVED_HOME_OK', im.size)
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Create Android project
        env:
          NODE_ENV: production
        run: npx expo prebuild --platform android --clean

      - name: Build release APK
        env:
          NODE_ENV: production
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Verify APK and prepare release
        run: |
          set -e
          test -s android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk TattieTCG.apk
          test -s TattieTCG.apk
          echo 'TATTIE_APK_BUILD_PASS'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TattieTCG-APK
          path: tattietcg/TattieTCG.apk
          retention-days: 30

      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view tattietcg-latest >/dev/null 2>&1; then
            gh release upload tattietcg-latest TattieTCG.apk --clobber
          else
            gh release create tattietcg-latest TattieTCG.apk --title "TattieTCG Android" --notes "TattieTCG Android APK."
          fi
