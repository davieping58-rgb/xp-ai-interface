name: TattieTCG Android APK
on:
  workflow_dispatch:
  push:
    branches: [tattietcg-android]
    paths: ['tattietcg/**', '.github/workflows/tattietcg-android.yml', 'api/tattie/**']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: tattietcg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Rebuild Wee Tattie image
        run: |
          base64 -d assets/wee-tattie-home.b64 > assets/wee-tattie-home.jpg
          test -s assets/wee-tattie-home.jpg
          file assets/wee-tattie-home.jpg | grep -q 'JPEG image data'
      - name: Validate exact approved home image
        run: |
          python -m pip install --disable-pip-version-check --quiet pillow
          python -c "from PIL import Image; from pathlib import Path; p=Path('assets/home-screen-exact.png'); assert p.exists() and p.stat().st_size>100000; im=Image.open(p); assert im.size==(1024,1536), im.size; im.verify(); print('APPROVED_HOME_OK')"
      - name: Apply exact approved home screen only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.js')
          s=p.read_text()
          a=s.index('function Home({go})')
          b=s.index('function Tattie(){')
          lines=[
              "function Home({go}){return <View style={s.exactHome}>",
              "  <Image source={require('../assets/home-screen-exact.png')} style={s.exactHomeImage} resizeMode=\"stretch\"/>",
              "  <Pressable accessibilityLabel=\"Talk to Wee Tattie\" onPress={()=>go('tattie')} style={[s.homeHit,{left:'0%',top:'0%',width:'100%',height:'35.5%'}]}/>",
              "  <Pressable accessibilityLabel=\"Card Scanner\" onPress={()=>go('scanner')} style={[s.homeHit,{left:'0%',top:'35.5%',width:'100%',height:'12%'}]}/>",
              "  <Pressable accessibilityLabel=\"Shop\" onPress={()=>go('shop')} style={[s.homeHit,{left:'0%',top:'47.5%',width:'50%',height:'13.5%'}]}/>",
              "  <Pressable accessibilityLabel=\"Community\" onPress={()=>go('community')} style={[s.homeHit,{left:'50%',top:'47.5%',width:'50%',height:'13.5%'}]}/>",
              "  <Pressable accessibilityLabel=\"Scanner\" onPress={()=>go('scanner')} style={[s.homeHit,{left:'20%',top:'89%',width:'20%',height:'11%'}]}/>",
              "  <Pressable accessibilityLabel=\"Shop\" onPress={()=>go('shop')} style={[s.homeHit,{left:'40%',top:'89%',width:'20%',height:'11%'}]}/>",
              "  <Pressable accessibilityLabel=\"Community\" onPress={()=>go('community')} style={[s.homeHit,{left:'60%',top:'89%',width:'20%',height:'11%'}]}/>",
              "  <Pressable accessibilityLabel=\"Menu\" onPress={()=>go('menu')} style={[s.homeHit,{left:'80%',top:'89%',width:'20%',height:'11%'}]}/>",
              "</View>}",
              ""
          ]
          s=s[:a]+'\n'.join(lines)+'\n'+s[b:]
          old="const s=StyleSheet.create({safe:{flex:1,backgroundColor:BG},"
          new="const s=StyleSheet.create({safe:{flex:1,backgroundColor:BG},exactHome:{flex:1,backgroundColor:BG,position:'relative'},exactHomeImage:{width:'100%',height:'100%'},homeHit:{position:'absolute',backgroundColor:'transparent'},"
          if old not in s: raise SystemExit('style anchor missing')
          s=s.replace(old,new,1)
          oldnav="{special?<View style={s.backDock}>"
          newnav="{screen==='home'?null:special?<View style={s.backDock}>"
          if oldnav not in s: raise SystemExit('nav anchor missing')
          s=s.replace(oldnav,newnav,1)
          p.write_text(s)
          PY
          grep -q "home-screen-exact.png" src/App.js
          grep -q "screen==='home'?null:special" src/App.js
          grep -q "exactHomeImage" src/App.js
          ! grep -q "HEY LEGEND" src/App.js
          ! grep -q "LAST 5" src/App.js
          ! grep -q "last5" src/App.js
      - name: Repair existing Tattie logo asset
        run: |
          python - <<'PY'
          from PIL import Image
          im=Image.open('assets/home-screen-exact.png').convert('RGB')
          im.crop((165,900,860,1360)).save('assets/tattie-logo.jpg','JPEG',quality=95)
          Image.open('assets/tattie-logo.jpg').verify()
          print('LOGO_OK')
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Create Android project
        run: npx expo prebuild --platform android --clean
      - name: Build standalone APK
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Verify APK exists
        run: test -s android/app/build/outputs/apk/release/app-release.apk
      - name: Prepare launch APK
        run: cp android/app/build/outputs/apk/release/app-release.apk TattieTCG.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TattieTCG-APK
          path: tattietcg/TattieTCG.apk
          retention-days: 30
      - name: Publish permanent APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view tattietcg-latest >/dev/null 2>&1; then
            gh release upload tattietcg-latest TattieTCG.apk --clobber
          else
            gh release create tattietcg-latest TattieTCG.apk --title "TattieTCG Android" --notes "Official TattieTCG Android APK."
          fi
          echo 'TATTIETCG_FINAL_APK_RELEASE_PASS'
