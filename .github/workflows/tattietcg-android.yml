name: TattieTCG Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - tattietcg-android
    paths:
      - 'tattietcg/**'
      - '.github/workflows/tattietcg-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tattietcg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify approved Tattie source
        run: |
          set -euo pipefail
          test "$PWD" = "$GITHUB_WORKSPACE/tattietcg"
          grep -q "./src/AppFinal" index.js
          grep -q "home-screen-exact.png" src/AppFinal.js
          grep -q '"name": "TattieTCG"' app.json
          grep -q '"package": "uk.domhnall.tattietcg"' app.json
          test "$(git hash-object assets/home-screen-exact.png)" = '7011fa135d7219ce23ad1b700b3d84394e45ff8b'
          if grep -Eqi 'XP Control|Holographic Control|XP Face|MOTHERSHIP|xpcore' src/AppFinal.js app.json index.js; then
            echo 'XP contamination detected in Tattie entry source'
            exit 1
          fi
          echo 'TATTIE_SOURCE_PASS'

      - name: Validate approved home artwork
        run: |
          python -m pip install --disable-pip-version-check --quiet pillow
          python - <<'PY'
          from PIL import Image
          p='assets/home-screen-exact.png'
          im=Image.open(p)
          im.verify()
          im=Image.open(p)
          assert im.size == (1024,1536), im.size
          print('APPROVED_HOME_OK', im.size)
          PY

      - name: Rebuild Wee Tattie helper image
        run: |
          base64 -d assets/wee-tattie-home.b64 > assets/wee-tattie-home.jpg
          test -s assets/wee-tattie-home.jpg

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Create Tattie Android project
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail
          test "$PWD" = "$GITHUB_WORKSPACE/tattietcg"
          rm -rf android
          npx expo prebuild --platform android --clean
          grep -Rqs 'uk.domhnall.tattietcg' android/app
          grep -Rqs 'TattieTCG' android/app/src/main

      - name: Build Tattie release APK
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK is Tattie before publishing
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -x "$AAPT"
          BADGING="$($AAPT dump badging "$APK")"
          echo "$BADGING" | grep -q "package: name='uk.domhnall.tattietcg'"
          echo "$BADGING" | grep -q "application-label:'TattieTCG'"
          unzip -l "$APK" | grep -q 'assets/index.android.bundle'
          unzip -p "$APK" assets/index.android.bundle > /tmp/tattie.bundle
          strings /tmp/tattie.bundle > /tmp/tattie.strings
          grep -q 'home-screen-exact.png' /tmp/tattie.strings
          grep -q 'TATTIE TCG' /tmp/tattie.strings
          grep -q 'CARD SCANNER' /tmp/tattie.strings
          if grep -Eqi 'XP Control|Holographic Control|XP Face|MOTHERSHIP|xpcore' /tmp/tattie.strings; then
            echo 'XP contamination detected inside built APK'
            exit 1
          fi
          cp "$APK" TattieTCG.apk
          echo 'TATTIE_APK_IDENTITY_PASS'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TattieTCG-APK
          path: tattietcg/TattieTCG.apk
          retention-days: 30

      - name: Publish verified Tattie APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view tattietcg-latest >/dev/null 2>&1; then
            gh release upload tattietcg-latest TattieTCG.apk --clobber
          else
            gh release create tattietcg-latest TattieTCG.apk --target "$GITHUB_SHA" --title "TattieTCG Android" --notes "Verified TattieTCG Android APK."
          fi
