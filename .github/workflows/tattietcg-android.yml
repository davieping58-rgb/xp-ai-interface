name: TattieTCG Android APK
on:
  workflow_dispatch:
  push:
    branches: [tattietcg-android]
    paths: ['tattietcg/**', '.github/workflows/tattietcg-android.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tattietcg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm || true
      - name: Verify final Tattie source before build
        run: |
          grep -q "CARD SCANNER" src/App.js
          grep -q "CameraView" src/App.js
          grep -q "Speech.speak" src/App.js
          grep -q "WEE TATTIE AI ONLINE" src/App.js
          grep -q "WEE TATTIE AI" src/App.js
          grep -q "AGENT_URL" src/App.js
          grep -q "LAST 5 SALES" src/App.js
          grep -q "https://tattie-tcg.myshopify.com" src/App.js
          grep -q "QRCode" src/App.js
          grep -q "DOMHNALL" src/App.js
          test -f assets/tattie-logo.jpg
          test -f assets/wee-tattie-home.jpg
          echo 'TATTIE_FINAL_SOURCE_REQUIREMENTS_PASS'
      - run: npm install --no-audit --no-fund
      - name: Install Expo 54 compatible camera and phone speech
        run: npx expo install expo-camera expo-speech
      - run: npx expo install --check
      - run: npx expo prebuild --platform android
      - name: Build standalone APK
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --build-cache
      - name: Boot Android and prove home installs launches and stays open
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          working-directory: tattietcg
          script: |
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            adb shell monkey -p uk.domhnall.tattietcg -c android.intent.category.LAUNCHER 1
            sleep 15
            PID="$(adb shell pidof uk.domhnall.tattietcg 2>/dev/null | tr -d '\r\n')"; [ -n "$PID" ] || PID="$(adb shell dumpsys activity activities | sed -n 's/.*ProcessRecord{[^ ]* \([0-9][0-9]*\):uk\.domhnall\.tattietcg.*/\1/p' | head -n1)"; echo "TattieTCG PID: $PID"; test -n "$PID" || (echo 'APP_NOT_RUNNING_AFTER_LAUNCH' && exit 1)
            adb shell dumpsys activity activities | grep -q 'ResumedActivity:.*uk.domhnall.tattietcg/.MainActivity' || (echo 'TATTIE_NOT_RESUMED_AFTER_LAUNCH' && exit 1)
            adb shell uiautomator dump /sdcard/tattie.xml >/dev/null || true
            adb shell cat /sdcard/tattie.xml | grep -q 'CARD SCANNER' || (echo 'FINAL_HOME_CARD_SCANNER_NOT_VISIBLE' && exit 1)
            adb shell cat /sdcard/tattie.xml | grep -q 'WEE TATTIE AI ONLINE' || (echo 'FINAL_HOME_WEE_TATTIE_NOT_VISIBLE' && exit 1)
            adb exec-out screencap -p > final-home.png
            test -s final-home.png || (echo 'FINAL_HOME_SCREENSHOT_MISSING' && exit 1)
            ! adb logcat -d | grep -A12 -B3 'FATAL EXCEPTION' | grep -q 'uk.domhnall.tattietcg' || (echo 'Runtime crash detected' && exit 1)
            echo 'RUNTIME_FINAL_HOME_PASS'
      - name: Upload final home screenshot
        uses: actions/upload-artifact@v4
        with:
          name: TattieTCG-Final-Home-Screenshot
          path: tattietcg/final-home.png
          retention-days: 30
      - run: cp android/app/build/outputs/apk/release/app-release.apk TattieTCG-Launch.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TattieTCG-Final-Launch-APK
          path: tattietcg/TattieTCG-Launch.apk
          retention-days: 30
      - name: Publish permanent launch APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view tattietcg-latest >/dev/null 2>&1; then
            gh release upload tattietcg-latest TattieTCG-Launch.apk --clobber
            cp TattieTCG-Launch.apk TattieTCG.apk
            gh release upload tattietcg-latest TattieTCG.apk --clobber
          else
            gh release create tattietcg-latest TattieTCG-Launch.apk --title "TattieTCG Android" --notes "Official TattieTCG launch APK."
            cp TattieTCG-Launch.apk TattieTCG.apk
            gh release upload tattietcg-latest TattieTCG.apk
          fi
          echo 'PERMANENT_FINAL_APK_RELEASE_PASS'
