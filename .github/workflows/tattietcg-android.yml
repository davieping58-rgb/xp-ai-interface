name: TattieTCG Android APK
on:
  workflow_dispatch:
  push:
    branches: [tattietcg-android]
    paths:
      - 'tattietcg/**'
      - '.github/workflows/tattietcg-android.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: tattietcg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Rebuild Wee Tattie image
        run: |
          base64 -d assets/wee-tattie-home.b64 > assets/wee-tattie-home.jpg
          test -s assets/wee-tattie-home.jpg
      - name: Validate supplied home image and repair logo
        run: |
          python -m pip install --disable-pip-version-check --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          p=Path('assets/home-screen-exact.jpg')
          if not p.exists() or p.stat().st_size < 100000:
              raise SystemExit('supplied Tattie home image missing')
          im=Image.open(p)
          if im.size != (1024,1536):
              raise SystemExit(f'wrong supplied home size: {im.size}')
          im.verify()
          im=Image.open(p).convert('RGB')
          im.crop((165,900,860,1360)).save('assets/tattie-logo.jpg','JPEG',quality=95,optimize=True)
          Image.open('assets/tattie-logo.jpg').verify()
          print('SUPPLIED_HOME_OK')
          PY
      - name: Apply supplied home screen only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.js')
          s=p.read_text()
          a=s.index('function Home({go})')
          b=s.index('function Tattie(){')
          home="function Home({go}){return <View style={s.exactHome}>\n  <Image source={require('../assets/home-screen-exact.jpg')} style={s.exactHomeImage} resizeMode=\"stretch\"/>\n  <Pressable accessibilityLabel=\"Talk to Wee Tattie\" onPress={()=>go('tattie')} style={[s.homeHit,{left:'0%',top:'0%',width:'100%',height:'35.5%'}]}/>\n  <Pressable accessibilityLabel=\"Card Scanner\" onPress={()=>go('scanner')} style={[s.homeHit,{left:'0%',top:'35.5%',width:'100%',height:'12%'}]}/>\n  <Pressable accessibilityLabel=\"Shop\" onPress={()=>go('shop')} style={[s.homeHit,{left:'0%',top:'47.5%',width:'50%',height:'13.5%'}]}/>\n  <Pressable accessibilityLabel=\"Community\" onPress={()=>go('community')} style={[s.homeHit,{left:'50%',top:'47.5%',width:'50%',height:'13.5%'}]}/>\n  <Pressable accessibilityLabel=\"Home\" onPress={()=>go('home')} style={[s.homeHit,{left:'0%',top:'89%',width:'20%',height:'11%'}]}/>\n  <Pressable accessibilityLabel=\"Scanner\" onPress={()=>go('scanner')} style={[s.homeHit,{left:'20%',top:'89%',width:'20%',height:'11%'}]}/>\n  <Pressable accessibilityLabel=\"Shop\" onPress={()=>go('shop')} style={[s.homeHit,{left:'40%',top:'89%',width:'20%',height:'11%'}]}/>\n  <Pressable accessibilityLabel=\"Community\" onPress={()=>go('community')} style={[s.homeHit,{left:'60%',top:'89%',width:'20%',height:'11%'}]}/>\n  <Pressable accessibilityLabel=\"Menu\" onPress={()=>go('menu')} style={[s.homeHit,{left:'80%',top:'89%',width:'20%',height:'11%'}]}/>\n</View>}\n\n"
          s=s[:a]+home+s[b:]
          old="const s=StyleSheet.create({safe:{flex:1,backgroundColor:BG},"
          new="const s=StyleSheet.create({safe:{flex:1,backgroundColor:BG},exactHome:{flex:1,backgroundColor:BG,position:'relative'},exactHomeImage:{width:'100%',height:'100%'},homeHit:{position:'absolute',backgroundColor:'transparent'},"
          if old not in s:
              raise SystemExit('style anchor missing')
          s=s.replace(old,new,1)
          oldnav="{special?<View style={s.backDock}>"
          newnav="{screen==='home'?null:special?<View style={s.backDock}>"
          if oldnav not in s:
              raise SystemExit('nav anchor missing')
          s=s.replace(oldnav,newnav,1)
          p.write_text(s)
          PY
          grep -q "home-screen-exact.jpg" src/App.js
          grep -q "screen==='home'?null:special" src/App.js
          ! grep -q "HEY LEGEND" src/App.js
          ! grep -q "LAST 5" src/App.js
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Create Android project
        run: npx expo prebuild --platform android --clean
      - name: Build standalone APK
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Verify APK exists
        run: test -s android/app/build/outputs/apk/release/app-release.apk
      - name: Prepare launch APK
        run: cp android/app/build/outputs/apk/release/app-release.apk TattieTCG.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TattieTCG-APK
          path: tattietcg/TattieTCG.apk
          retention-days: 30
      - name: Publish permanent APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view tattietcg-latest >/dev/null 2>&1; then
            gh release upload tattietcg-latest TattieTCG.apk --clobber
          else
            gh release create tattietcg-latest TattieTCG.apk --title "TattieTCG Android" --notes "Official TattieTCG Android APK."
          fi
