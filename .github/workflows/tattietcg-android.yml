name: TattieTCG Android APK
on:
  workflow_dispatch:
  push:
    branches: [tattietcg-android]
    paths:
      - 'tattietcg/**'
      - '.github/workflows/tattietcg-android.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: tattietcg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Prove this is Tattie, not XP
        run: |
          grep -q '"name":"TattieTCG"' app.json
          grep -q 'uk.domhnall.tattietcg' app.json
          grep -q 'function Scanner' src/App.js
          grep -q 'function Tattie' src/App.js
          grep -q 'function Community' src/App.js
          if grep -Eqi 'XP Control|Holographic Control|XP Face|xp_face|assets/xp' src/App.js app.json; then
            echo 'XP contamination detected in Tattie source'
            exit 1
          fi
          HOME_BLOB=$(git hash-object assets/home-screen-exact.jpg)
          echo "TATTIE_HOME_BLOB=$HOME_BLOB"
          test "$HOME_BLOB" = '9bf179ba41a250632d8751a537abf6f8961483c9'

      - name: Rebuild Wee Tattie helper image
        run: |
          base64 -d assets/wee-tattie-home.b64 > assets/wee-tattie-home.jpg
          test -s assets/wee-tattie-home.jpg

      - name: Validate approved Tattie home and repair logo
        run: |
          python -m pip install --disable-pip-version-check --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          p=Path('assets/home-screen-exact.jpg')
          if not p.exists() or p.stat().st_size < 5000:
              raise SystemExit('approved Tattie home image missing')
          im=Image.open(p)
          im.verify()
          im=Image.open(p).convert('RGB')
          w,h=im.size
          if (w,h)!=(1024,1536):
              raise SystemExit(f'wrong Tattie home dimensions: {w}x{h}')
          im.crop((int(w*.16),int(h*.58),int(w*.84),int(h*.89))).save('assets/tattie-logo.jpg','JPEG',quality=95,optimize=True)
          Image.open('assets/tattie-logo.jpg').verify()
          print('APPROVED_TATTIE_HOME_OK',w,h)
          PY

      - name: Apply approved Tattie home only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.js')
          s=p.read_text()
          a=s.index('function Home({go})')
          b=s.index('function Tattie(){')
          home="""function Home({go}){return <View style={s.exactHome}>
  <Image source={require('../assets/home-screen-exact.jpg')} style={s.exactHomeImage} resizeMode="stretch"/>
  <Pressable accessibilityLabel="Talk to Wee Tattie" onPress={()=>go('tattie')} style={[s.homeHit,{left:'0%',top:'0%',width:'100%',height:'35.5%'}]}/>
  <Pressable accessibilityLabel="Card Scanner" onPress={()=>go('scanner')} style={[s.homeHit,{left:'0%',top:'35.5%',width:'100%',height:'12%'}]}/>
  <Pressable accessibilityLabel="Shop" onPress={()=>go('shop')} style={[s.homeHit,{left:'0%',top:'47.5%',width:'50%',height:'13.5%'}]}/>
  <Pressable accessibilityLabel="Community" onPress={()=>go('community')} style={[s.homeHit,{left:'50%',top:'47.5%',width:'50%',height:'13.5%'}]}/>
  <Pressable accessibilityLabel="Home" onPress={()=>go('home')} style={[s.homeHit,{left:'0%',top:'89%',width:'20%',height:'11%'}]}/>
  <Pressable accessibilityLabel="Scanner" onPress={()=>go('scanner')} style={[s.homeHit,{left:'20%',top:'89%',width:'20%',height:'11%'}]}/>
  <Pressable accessibilityLabel="Shop" onPress={()=>go('shop')} style={[s.homeHit,{left:'40%',top:'89%',width:'20%',height:'11%'}]}/>
  <Pressable accessibilityLabel="Community" onPress={()=>go('community')} style={[s.homeHit,{left:'60%',top:'89%',width:'20%',height:'11%'}]}/>
  <Pressable accessibilityLabel="Menu" onPress={()=>go('menu')} style={[s.homeHit,{left:'80%',top:'89%',width:'20%',height:'11%'}]}/>
</View>}

"""
          s=s[:a]+home+s[b:]

          old="const s=StyleSheet.create({safe:{flex:1,backgroundColor:BG},"
          new="const s=StyleSheet.create({safe:{flex:1,backgroundColor:BG},exactHome:{flex:1,backgroundColor:BG,position:'relative',overflow:'hidden'},exactHomeImage:{...StyleSheet.absoluteFillObject,width:undefined,height:undefined},homeHit:{position:'absolute',backgroundColor:'transparent'},"
          if old not in s:
              raise SystemExit('style anchor missing')
          s=s.replace(old,new,1)

          oldnav="{special?<View style={s.backDock}>"
          newnav="{screen==='home'?null:special?<View style={s.backDock}>"
          if oldnav not in s:
              raise SystemExit('navigation anchor missing')
          s=s.replace(oldnav,newnav,1)

          oldshell='return <SafeAreaView style={s.safe}><StatusBar style="light"/>'
          newshell="const Shell=screen==='home'?View:SafeAreaView;return <Shell style={s.safe}><StatusBar hidden={screen==='home'} style=\"light\"/>"
          if oldshell not in s:
              raise SystemExit('app shell anchor missing')
          s=s.replace(oldshell,newshell,1)
          closing='</SafeAreaView>}\n\nconst s=StyleSheet.create('
          if closing not in s:
              raise SystemExit('app shell closing anchor missing')
          s=s.replace(closing,'</Shell>}\n\nconst s=StyleSheet.create(',1)

          p.write_text(s)
          PY
          grep -q "home-screen-exact.jpg" src/App.js
          grep -q "screen==='home'?null:special" src/App.js
          grep -q "const Shell=screen==='home'?View:SafeAreaView" src/App.js
          ! grep -q "HEY LEGEND" src/App.js
          ! grep -q "LAST 5" src/App.js
          if grep -Eqi 'XP Control|Holographic Control|XP Face|xp_face|assets/xp' src/App.js app.json; then
            echo 'XP contamination introduced during patch'
            exit 1
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Create Android project
        run: npx expo prebuild --platform android --clean

      - name: Build standalone APK
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Verify APK exists
        run: test -s android/app/build/outputs/apk/release/app-release.apk

      - name: Boot Android, launch Tattie and capture real home screen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: tattietcg
          script: |
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            adb shell settings put global policy_control immersive.full=uk.domhnall.tattietcg || true
            adb shell monkey -p uk.domhnall.tattietcg -c android.intent.category.LAUNCHER 1
            sleep 8
            PID=$(adb shell pidof uk.domhnall.tattietcg | tr -d '\r')
            echo "TattieTCG PID: $PID"
            test -n "$PID"
            adb shell dumpsys activity activities | grep -q 'uk.domhnall.tattietcg'
            if adb logcat -d '*:E' | grep -E 'FATAL EXCEPTION|Process: uk.domhnall.tattietcg'; then
              echo 'Runtime crash detected'
              exit 1
            fi
            adb exec-out screencap -p > tattie-home-runtime.png
            test -s tattie-home-runtime.png
            echo 'TATTIE_RUNTIME_ALIVE'

      - name: Prove rendered home matches approved Tattie screen
        run: |
          python - <<'PY'
          from PIL import Image, ImageChops, ImageStat
          ref=Image.open('assets/home-screen-exact.jpg').convert('RGB')
          scr=Image.open('tattie-home-runtime.png').convert('RGB')
          w,h=scr.size
          ref_small=ref.resize((128,192),Image.Resampling.LANCZOS)
          best=(999,None,None)
          for top in range(0,min(161,h//6),8):
              for bottom in range(0,min(241,h//5),8):
                  if h-top-bottom < int(h*.75):
                      continue
                  crop=scr.crop((0,top,w,h-bottom)).resize((128,192),Image.Resampling.LANCZOS)
                  mean=ImageStat.Stat(ImageChops.difference(crop,ref_small)).mean
                  mae=sum(mean)/3
                  if mae < best[0]:
                      best=(mae,top,bottom)
          print('TATTIE_VISUAL_MAE',round(best[0],2),'TOP',best[1],'BOTTOM',best[2])
          if best[0] > 32:
              raise SystemExit('real Android home does not match approved Tattie home')
          print('REAL_TATTIE_HOME_VISUAL_PASS')
          PY

      - name: Upload real phone-screen proof
        uses: actions/upload-artifact@v4
        with:
          name: TattieTCG-Verified-Home-Screenshot
          path: tattietcg/tattie-home-runtime.png
          retention-days: 30

      - name: Prepare launch APK
        run: cp android/app/build/outputs/apk/release/app-release.apk TattieTCG.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TattieTCG-APK
          path: tattietcg/TattieTCG.apk
          retention-days: 30

      - name: Publish only after runtime and visual proof pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view tattietcg-latest >/dev/null 2>&1; then
            gh release upload tattietcg-latest TattieTCG.apk --clobber
          else
            gh release create tattietcg-latest TattieTCG.apk --title "TattieTCG Android" --notes "Official verified TattieTCG Android APK."
          fi
