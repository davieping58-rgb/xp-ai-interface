name: TattieTCG Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - tattietcg-android
    paths:
      - 'tattietcg/**'
      - '.github/workflows/tattietcg-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: tattietcg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Verify final Tattie source before build
        run: |
          set -e
          grep -q "./src/AppFinal" index.js
          grep -q "home-screen-exact.png" src/AppFinal.js
          grep -q "function Scanner" src/AppFinal.js
          grep -q "function Tattie" src/AppFinal.js
          grep -q "function Community" src/AppFinal.js
          grep -q '"name": "TattieTCG"' app.json
          grep -q '"package": "uk.domhnall.tattietcg"' app.json
          grep -q '"versionCode": 23' app.json
          test "$(git hash-object assets/home-screen-exact.png)" = '7011fa135d7219ce23ad1b700b3d84394e45ff8b'
          if grep -Eqi 'XP Control|Holographic Control|XP Face|xp_face|assets/xp' src/AppFinal.js app.json index.js; then
            echo 'XP contamination detected'
            exit 1
          fi
          ! grep -q 'HEY LEGEND' src/AppFinal.js
          ! grep -q 'LAST 5' src/AppFinal.js
          echo 'SOURCE_PRECHECK_PASS'

      - name: Rebuild Wee Tattie helper image
        run: |
          base64 -d assets/wee-tattie-home.b64 > assets/wee-tattie-home.jpg
          test -s assets/wee-tattie-home.jpg

      - name: Validate approved home artwork
        run: |
          python -m pip install --disable-pip-version-check --quiet pillow
          python - <<'PY'
          from PIL import Image
          p='assets/home-screen-exact.png'
          im=Image.open(p)
          im.verify()
          im=Image.open(p)
          if im.size != (1024,1536):
              raise SystemExit(f'wrong home dimensions: {im.size}')
          print('APPROVED_HOME_OK', im.size)
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Create Android project
        run: npx expo prebuild --platform android --clean

      - name: Build release APK
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Verify APK exists
        run: test -s android/app/build/outputs/apk/release/app-release.apk

      - name: Runtime launch and capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: tattietcg
          script: |
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            adb shell monkey -p uk.domhnall.tattietcg -c android.intent.category.LAUNCHER 1
            sleep 8
            PID=$(adb shell pidof uk.domhnall.tattietcg | tr -d '\r')
            test -n "$PID"
            if adb logcat -d '*:E' | grep -E 'FATAL EXCEPTION|Process: uk.domhnall.tattietcg'; then
              exit 1
            fi
            adb exec-out screencap -p > tattie-home-runtime.png
            test -s tattie-home-runtime.png

      - name: Visual check against approved Tattie home
        run: |
          python - <<'PY'
          from PIL import Image,ImageChops,ImageStat
          ref=Image.open('assets/home-screen-exact.png').convert('RGB').resize((128,192))
          scr=Image.open('tattie-home-runtime.png').convert('RGB')
          sw,sh=scr.size
          best=999
          for top in range(0,min(200,sh//5)+1,10):
              for bottom in range(0,min(300,sh//4)+1,10):
                  if sh-top-bottom < sh*0.7: continue
                  crop=scr.crop((0,top,sw,sh-bottom)).resize((128,192))
                  mae=sum(ImageStat.Stat(ImageChops.difference(crop,ref)).mean)/3
                  best=min(best,mae)
          print('VISUAL_MAE',best)
          if best>40:
              raise SystemExit('Rendered home does not match approved Tattie artwork')
          print('REAL_TATTIE_HOME_PASS')
          PY

      - name: Upload screenshot proof
        uses: actions/upload-artifact@v4
        with:
          name: TattieTCG-Home-Proof
          path: tattietcg/tattie-home-runtime.png
          retention-days: 30

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/release/app-release.apk TattieTCG.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TattieTCG-APK
          path: tattietcg/TattieTCG.apk
          retention-days: 30

      - name: Publish verified APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view tattietcg-latest >/dev/null 2>&1; then
            gh release upload tattietcg-latest TattieTCG.apk --clobber
          else
            gh release create tattietcg-latest TattieTCG.apk --title "TattieTCG Android" --notes "Verified TattieTCG Android APK."
          fi
