name: TattieTCG Android APK
on:
  workflow_dispatch:
  push:
    branches: [tattietcg-android]
    paths: ['tattietcg/**', '.github/workflows/tattietcg-android.yml', 'api/tattie/**']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: tattietcg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Rebuild Wee Tattie image
        run: |
          base64 -d assets/wee-tattie-home.b64 > assets/wee-tattie-home.jpg
          test -s assets/wee-tattie-home.jpg
          file assets/wee-tattie-home.jpg | grep -q 'JPEG image data'
      - name: Apply approved Tattie home and scanner polish
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.js')
          s=p.read_text()
          s=s.replace("quality:.45,base64:true","quality:.88,base64:true")
          old="homeLogo:{width:'160%',height:'160%'},homeBrand:{width:'100%',height:140,alignItems:'center',justifyContent:'center',overflow:'hidden',borderRadius:16,backgroundColor:BG}"
          new="homeLogo:{width:'100%',height:'100%'},homeBrand:{width:'100%',height:260,alignItems:'center',justifyContent:'center',overflow:'hidden',borderRadius:24,backgroundColor:BG,paddingHorizontal:4,paddingVertical:6,marginTop:4}"
          if old not in s: raise SystemExit('home logo styles not found')
          s=s.replace(old,new)
          s=s.replace("<Text style={s.scanInstruction}>Position card inside frame</Text>","<View style={s.scanReady}><Ionicons name=\"scan-circle\" size={24} color={BLUE}/><Text style={s.scanInstruction}>Hold card flat inside the frame, then tap the camera</Text></View>")
          p.write_text(s)
          PY
          grep -q "quality:.88" src/App.js
          grep -q "homeLogo:{width:'100%',height:'100%'" src/App.js
          grep -q "height:260" src/App.js
          ! grep -q "brandName}>TattieTCG" src/App.js
          ! grep -q "quality:.45" src/App.js
      - name: Verify final source before build minutes
        run: |
          set -e
          grep -q "CARD SCANNER" src/App.js
          grep -q "SCAN_API" src/App.js
          grep -q "takePictureAsync" src/App.js
          grep -q "base64:true" src/App.js
          grep -q "quality:.88" src/App.js
          grep -q "tattieKnowledge" src/App.js
          grep -q "AsyncStorage" src/App.js
          grep -q "LEGENDARY PULL DETECTED" src/App.js
          grep -q "getAvailableVoicesAsync" src/App.js
          grep -q "WEE TATTIE AI ONLINE" src/App.js
          grep -q "weeTattieAgent" src/App.js
          grep -q "askWeeTattie" src/App.js
          grep -q "api/tattie/agent" src/weeTattieAgent.js
          grep -q "api/tattie/scan" src/App.js
          grep -q "api/tattie/download" src/App.js
          grep -q '"icon":"./assets/wee-tattie-home.jpg"' app.json
          grep -q "Pokémon" src/App.js
          grep -q "Yu-Gi-Oh" src/App.js
          grep -q "COMMUNITY" src/App.js
          grep -q "homeLogo:{width:'100%',height:'100%'" src/App.js
          ! grep -q "LAST 5" src/App.js
          ! grep -q "last5" src/App.js
          ! grep -q "google.com/search" src/App.js
          ! grep -q "POWERED BY XP AI" src/App.js
          ! grep -q "clean Tattie download route" src/App.js
          ! grep -q "AI_GATEWAY_API_KEY" ../api/tattie/chat.js
          ! grep -q "VERCEL_OIDC_TOKEN" ../api/tattie/chat.js
          ! grep -q "ai-gateway.vercel.sh" ../api/tattie/chat.js
          ! grep -q "ai-gateway.vercel.sh" ../api/tattie/scan.js
          grep -q "OPENAI_API_KEY" ../api/tattie/chat.js
          grep -q "OPENAI_API_KEY" ../api/tattie/scan.js
          grep -q "https://api.openai.com/v1/responses" ../api/tattie/chat.js
          grep -q "https://api.openai.com/v1/responses" ../api/tattie/scan.js
          grep -q "gpt-5.6-luna" ../api/tattie/chat.js
          grep -q "gpt-5.6-luna" ../api/tattie/scan.js
          grep -q "api.pokemontcg.io" ../api/tattie/scan.js
          grep -q "ygoprodeck.com" ../api/tattie/scan.js
      - run: npm install --no-audit --no-fund
      - name: Expo dependency health check
        run: npx expo install --check
      - run: npx expo prebuild --platform android --clean
      - name: Build standalone APK
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Verify APK exists
        run: test -s android/app/build/outputs/apk/release/app-release.apk
      - name: Prepare launch APK
        run: cp android/app/build/outputs/apk/release/app-release.apk TattieTCG.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TattieTCG-APK
          path: tattietcg/TattieTCG.apk
          retention-days: 30
      - name: Publish permanent APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view tattietcg-latest >/dev/null 2>&1; then
            gh release upload tattietcg-latest TattieTCG.apk --clobber
          else
            gh release create tattietcg-latest TattieTCG.apk --title "TattieTCG Android" --notes "Official TattieTCG Android APK."
          fi
          echo 'TATTIETCG_FINAL_APK_RELEASE_PASS'
