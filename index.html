<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XP Command Center</title><style>*{box-sizing:border-box}body{margin:0;background:#030509;color:#c8f7ff;font-family:Segoe UI,Arial,sans-serif;overflow:hidden}#app{height:100vh;display:grid;grid-template:70px 1fr 100px/280px 1fr 320px;gap:10px;padding:10px;background:radial-gradient(circle at 50% 45%,#0a2440 0,#050914 35%,#020306 70%)}header{grid-column:1/4;border:1px solid #1d87b7;background:#06101a;display:flex;align-items:center;justify-content:space-between;padding:0 22px;box-shadow:0 0 22px #0877a955}.brand{font-size:26px;font-weight:800;color:#7be7ff}.brand span{font-size:14px;letter-spacing:4px;color:#a7b9c9;margin-left:10px}.status{color:#60ffad}.deck{border:1px solid #155d83;background:#06101acc;padding:14px;margin-bottom:10px;box-shadow:inset 0 0 25px #0877a922}.deck h3{font-size:12px;letter-spacing:3px;color:#54c9ff;margin:0 0 12px}.left,.right{overflow:auto}.stage{display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;border:1px solid #0c4668;background:radial-gradient(circle,#0d2943aa,#03060b 65%)}.face{width:min(46vw,520px);filter:drop-shadow(0 0 24px #1db6ff);animation:pulse 3s infinite}.ring{position:absolute;width:62%;aspect-ratio:1;border:1px solid #1ab4ff55;border-radius:50%;box-shadow:0 0 50px #1ab4ff33;animation:spin 18s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{filter:drop-shadow(0 0 40px #8c4dff)}}#caption{margin-top:12px;letter-spacing:3px;color:#76eaff}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{padding:10px;border:1px solid #144b68;background:#07131e}.stat b{display:block;font-size:22px;color:#6beaff}.web{display:grid;grid-template-columns:1fr 1fr;gap:7px}button{background:#071925;border:1px solid #1b7aa6;color:#9eeeff;padding:10px;cursor:pointer}button:hover{background:#0b3046}video{width:100%;background:#000;min-height:150px}.chat{grid-column:1/4;border:1px solid #1b7aa6;background:#05101a;display:grid;grid-template-columns:1fr auto auto;gap:8px;padding:12px}.chatlog{grid-column:1/4;height:38px;overflow:auto;font-size:12px;color:#8faebb}.chat input{background:#02070c;border:1px solid #1a6f98;color:white;padding:12px;font-size:16px}.small{font-size:12px;color:#7896a9;line-height:1.5}#imagePreview{max-width:100%;max-height:130px;display:none;margin-top:8px}</style></head><body><main id="app"><header><div class="brand">XP <span>COMMAND CENTER // CHROME</span></div><div class="status" id="status">● READY</div></header><aside class="left"><section class="deck"><h3>XP LINK</h3><div class="small">Browser command centre<br>Core endpoint <input id="coreUrl" value="http://127.0.0.1:8765" style="width:100%;margin-top:8px;background:#02070c;color:#9eeeff;border:1px solid #155d83;padding:7px"><button id="check" style="width:100%;margin-top:7px">CHECK XP CORE</button></div></section><section class="deck"><h3>LIVE CAMERA</h3><video id="cam" autoplay muted playsinline></video><div class="web"><button id="camOn">START</button><button id="camOff">STOP</button></div></section><section class="deck"><h3>SHARED IMAGE</h3><input id="file" type="file" accept="image/*"><img id="imagePreview"></section></aside><section class="stage"><div class="ring"></div><img class="face" src="assets/xp_face.png" alt="XP"><div id="caption">XP // STANDING BY</div></section><aside class="right"><section class="deck"><h3>WEB DECK</h3><div class="web"><button data-url="https://www.google.com">GOOGLE</button><button data-url="https://www.youtube.com">YOUTUBE</button><button data-url="https://github.com">GITHUB</button><button data-url="https://www.google.com/maps">MAPS</button></div></section><section class="deck"><h3>SESSION</h3><div class="stats"><div class="stat">MESSAGES<b id="count">0</b></div><div class="stat">TIME<b id="clock">00:00</b></div></div><button id="export" style="width:100%;margin-top:8px">EXPORT CHAT LOG</button><button id="clear" style="width:100%;margin-top:8px">CLEAR LOG</button></section><section class="deck"><h3>VOICE</h3><button id="voice" style="width:100%">🎙 TALK TO XP</button><div class="small" id="voiceState">Ready</div></section></aside><section class="chat"><div class="chatlog" id="log">XP Command Center ready.</div><input id="msg" placeholder="Talk to XP…"><button id="attach">📎 PICTURE</button><button id="send">SEND</button></section></main><script>const $=id=>document.getElementById(id),start=Date.now();let stream=null,n=0,history=JSON.parse(localStorage.getItem('xpChromeLog')||'[]');function say(t){$('caption').textContent=t}function render(){$('log').innerHTML=history.slice(-8).map(x=>'<b>'+x.who+':</b> '+x.text).join(' &nbsp; • &nbsp; ');$('count').textContent=n=history.filter(x=>x.who==='DAVIE').length;localStorage.setItem('xpChromeLog',JSON.stringify(history))}async function core(path='',opt={}){const base=$('coreUrl').value.replace(/\/$/,'');const r=await fetch(base+path,opt);if(!r.ok)throw Error('HTTP '+r.status);const text=await r.text();try{return JSON.parse(text)}catch{return{text}}}$('check').onclick=async()=>{try{await core('/');$('status').textContent='● XP CORE ONLINE';say('XP // CORE ONLINE')}catch(e){$('status').textContent='● CORE NOT REACHABLE';say('XP // CHECK LOCAL CORE')}};async function send(){const text=$('msg').value.trim();if(!text)return;$('msg').value='';history.push({who:'DAVIE',text,time:new Date().toISOString()});render();say('XP // THINKING');let last;for(const [p,b] of [['/chat',{message:text}],['/message',{message:text}],['/ask',{message:text}],['/handoff',{message:text}],['/',{message:text}]]){try{const r=await core(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const reply=r.reply||r.response||r.answer||r.message||r.text||JSON.stringify(r);history.push({who:'XP',text:String(reply),time:new Date().toISOString()});render();say('XP // REPLY RECEIVED');return}catch(e){last=e}}history.push({who:'SYSTEM',text:'Core connection failed: '+last,time:new Date().toISOString()});render();say('XP // CORE CONNECTION FAILED')}$('send').onclick=send;$('msg').onkeydown=e=>{if(e.key==='Enter')send()};$('camOn').onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});$('cam').srcObject=stream;say('XP // LIVE CAMERA')}catch(e){say('CAMERA PERMISSION NEEDED')}};$('camOff').onclick=()=>{if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('cam').srcObject=null};$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const u=URL.createObjectURL(f);$('imagePreview').src=u;$('imagePreview').style.display='block';say('IMAGE READY // '+f.name)};$('attach').onclick=()=>$('file').click();document.querySelectorAll('[data-url]').forEach(b=>b.onclick=()=>window.open(b.dataset.url,'_blank'));$('voice').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('voiceState').textContent='Speech recognition unavailable';return}const r=new SR();r.lang='en-GB';r.onstart=()=>$('voiceState').textContent='Listening…';r.onresult=e=>{$('msg').value=e.results[0][0].transcript;send()};r.onend=()=>$('voiceState').textContent='Ready';r.start()};$('export').onclick=()=>{const blob=new Blob([history.map(x=>x.time+' '+x.who+': '+x.text).join('\n')],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='XP-chat-log.txt';a.click()};$('clear').onclick=()=>{history=[];render()};setInterval(()=>{const s=Math.floor((Date.now()-start)/1000);$('clock').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},1000);render();</script></body></html>
